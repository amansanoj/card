      .context {
        font-size: 0.95rem;
        color: var(--muted-foreground);

      .save-contact {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        width: 100%;
        padding: 15px 20px;
        background: var(--primary);
        color: var(--primary-foreground);
        border-radius: var(--radius);
        text-decoration: none;
        font-weight: 600;
        font-size: 1rem;
        border: none;
        transition: opacity 0.15s ease;
      }

      .save-contact:hover,
      .save-contact:focus-visible {
        opacity: 0.9;
      }

      .save-contact:focus-visible {
        outline: 2px solid var(--primary-400);
        outline-offset: 2px;
      }

      .save-contact i {
        font-size: 1.25rem;
        line-height: 1;
        flex-shrink: 0;
      }

      .links {
        width: 100%;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .link-row {
        display: flex;
        align-items: center;
        gap: 14px;
        width: 100%;
        padding: 14px 16px;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        text-decoration: none;
        color: var(--text);
        transition: border-color 0.15s ease, background-color 0.15s ease;
      }

      .link-row:focus-visible {
        border-color: var(--accent);
        background: color-mix(in oklch, var(--accent) 14%, var(--background));
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      .link-row:focus-visible .icon {
        color: var(--accent);
      }

      @media (hover: hover) {
        .link-row:hover {
          border-color: var(--accent);
          background: color-mix(in oklch, var(--accent) 14%, var(--background));
        }

        .link-row:hover .icon {
          color: var(--accent);
        }
      }

      .icon {
        font-size: 1.25rem;
        line-height: 1;
        width: 20px;
        text-align: center;
        flex-shrink: 0;
        color: var(--secondary);
        transition: color 0.15s ease;
      }

      .link-text {
        display: flex;
        flex-direction: column;
